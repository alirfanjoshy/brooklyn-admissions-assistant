services:
  - type: web
    name: brooklyn-admissions-assistant
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/chat/status
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
